<div class="container">
    <div class="modal">
       
            <div class="modal-header">
                <h2>Sign in</h2>
            </div>
            <form #regform="ngForm" (ngSubmit)="saveuser(regform)">
                <div>
                    <input type="text" name="firstName" placeholder="First name" required ngModel #firstName="ngModel">
                    <div *ngIf="firstName.invalid && firstName.touched" class="error">
                        First name is required.
                    </div>
                </div>
            
                <div>
                    <input type="text" name="lastName" placeholder="Last name" required ngModel #lastName="ngModel">
                    <div *ngIf="lastName.invalid && lastName.touched" class="error">
                        Last name is required.
                    </div>
                </div>
            
                <div>
                    <input type="email" name="email" id="dataInput2" placeholder="Email" required email ngModel #email="ngModel">
                    <div *ngIf="email.invalid && email.touched" class="error">
                        Please enter a valid email address.
                    </div>
                </div>
            
                <div>
                    <input type="text" name="contactNo" placeholder="Contact No" required pattern="[0-9]{10}" ngModel
                        #contactNo="ngModel">
                    <div *ngIf="contactNo.invalid && contactNo.touched" class="error">
                        Contact number must be 10 digits.
                    </div>
                </div>
            
                <div>
                    <input type="text" name="dob" placeholder="DOB (YYYY-MM-DD)" required pattern="\d{4}-\d{2}-\d{2}" ngModel
                        #dob="ngModel">
                    <div *ngIf="dob.invalid && dob.touched" class="error">
                        Enter a valid date of birth in YYYY-MM-DD format.
                    </div>
                </div>
            
                <div>
                    <input type="text" name="bloodGroup" placeholder="Blood group" required ngModel #bloodGroup="ngModel">
                    <div *ngIf="bloodGroup.invalid && bloodGroup.touched" class="error">
                        Blood group is required.
                    </div>
                </div>
            
                <div>
                    <input type="password" name="password" placeholder="Password" required minlength="6" ngModel
                        #password="ngModel">
                    <div *ngIf="password.invalid && password.touched" class="error">
                        Password must be at least 6 characters long.
                    </div>
                </div>
            
                <div class="checkbox-container">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to Metro
                        <a routerLink="/services">Terms of Service</a> and
                        <a routerLink="/privacypolicies">Privacy Policy</a>
                    </label>
                </div>
            
                <button type="submit" class="create-account" [disabled]="regform.invalid">
                    Create account
                </button>
                <div class="or">or</div>
                <button type="button" class="google-signin">
                    <img src="https://www.google.com/favicon.ico" alt="Google icon"> Sign in with Google
                </button>
                <p class="login-link">
                    Already have an account? <a routerLink="/login">Log in</a>
                </p>
            </form>
        </div>
    </div>
    
    <style>
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
